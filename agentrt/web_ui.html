<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件助手</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e4e2dc;--accent:#c2552d;--accent-ink:#fff;--ok:#2f7d4f;--bad:#b3261e;--warn-bg:#fff6e5;--warn-line:#f0d9a8;--code:#f1efe9}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecebe6;--mute:#9a988f;--line:#33322e;--accent:#e0714a;--accent-ink:#1a1a18;--ok:#5fb383;--bad:#f07a70;--warn-bg:#2b2517;--warn-line:#5a4a22;--code:#2a2926}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
header input,header select{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#ws{flex:1;min-width:180px;font-family:ui-monospace,Menlo,monospace}
.badge{font-size:12px;color:var(--mute)}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--mute)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
main{flex:1;overflow-y:auto;padding:20px 16px}
.col{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{padding:10px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word}
.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);max-width:85%}
.final{background:var(--panel);border:1px solid var(--line)}
.final .meta{display:block;margin-top:8px;font-size:12px;color:var(--mute)}
.sys{align-self:center;font-size:12px;color:var(--mute)}
.step{font-size:13px;color:var(--mute);border-left:2px solid var(--line);padding:2px 0 2px 10px}
.step b{color:var(--ink);font-weight:600}
.step code,.final code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--code);padding:1px 5px;border-radius:5px}
.step details{margin-top:2px}
.step pre{margin:4px 0 0;white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;max-height:220px;overflow:auto;background:var(--code);padding:8px;border-radius:8px;color:var(--ink)}
.bad{color:var(--bad)}.good{color:var(--ok)}
.approval{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:12px 14px}
.approval h3{margin:0 0 4px;font-size:14px}
.approval .why{font-size:13px;color:var(--mute);margin-bottom:6px}
.approval pre{margin:0 0 10px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Menlo,monospace;max-height:240px;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:8px;border-radius:8px}
.approval .row{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{border-radius:999px;font-size:13px}
.hero{text-align:center;margin-top:8vh}.hero h2{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:var(--mute)}
footer{border-top:1px solid var(--line);background:var(--panel);padding:12px 16px}
footer .col{flex-direction:row;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);max-height:160px}
textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.status{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center;min-height:20px}
.status.busy{color:var(--accent)}.status.wait{color:var(--bad);font-weight:600}
.status.idle #glyph{color:var(--ok)}
button.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.dots::after{content:"";animation:d 1.2s steps(4) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
</style>
</head>
<body>
<header>
  <h1>📁 文件助手</h1>
  <input id="ws" placeholder="工作范围，如 ~/Downloads" spellcheck="false" aria-label="工作范围">
  <select id="mode" aria-label="权限模式">
    <option value="default">改动前确认</option>
    <option value="plan">只读</option>
    <option value="auto">自动执行（删除仍确认）</option>
  </select>
  <button id="apply">应用</button>
  <button id="clear">清空对话</button>
  <span class="badge" id="model"></span>
</header>
<main id="main"><div class="col" id="log"></div></main>
<footer><div class="col" style="flex-direction:column;align-items:stretch;gap:6px"><div id="status" class="status idle"><span id="glyph">●</span> <span id="stext">空闲，可以输入</span></div><div style="display:flex;gap:8px;align-items:flex-end">
  <textarea id="inp" rows="1" placeholder="告诉我想找什么、统计什么、清理什么…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button class="primary" id="send">发送</button>
</div></div></footer>
<script>
const T = new URLSearchParams(location.search).get("t");
const $ = id => document.getElementById(id);
const log = $("log"), main = $("main");
const SUGGEST = ["统计这个目录下各类文件的数量和占用空间","找出最大的 20 个文件","列出最近 7 天修改过的文件","找出重复的文件","找名字里带“发票”的 pdf","把 2023 年以前的 .log 文件清理掉"];
const api = (p, body) => fetch(p + "?t=" + T, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)}).then(r => r.json());
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const md = s => esc(s).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
let busy = false, thinking = null, steps = {};
let phase = "idle", t0 = 0, nSteps = 0, tokens = 0, frame = 0;
const FR = ["◐","◓","◑","◒"];
function setPhase(p, detail) { phase = p; if (p === "idle") t0 = 0; else if (!t0) { t0 = Date.now(); nSteps = 0; tokens = 0; } window.detail = detail || ""; render(); }
function render() {
  const st = $("status"), secs = t0 ? Math.floor((Date.now() - t0) / 1000) : 0;
  const fmt = n => n >= 1000 ? (n / 1000).toFixed(1) + "k" : n;
  if (phase === "idle") { st.className = "status idle"; $("glyph").textContent = "●"; $("stext").textContent = "空闲，可以输入"; }
  else if (phase === "wait") { st.className = "status wait"; $("glyph").textContent = "!"; $("stext").textContent = `等你确认后才会继续（${secs}s）`; }
  else { st.className = "status busy"; $("glyph").textContent = FR[frame % 4];
    $("stext").textContent = (phase === "tool" ? `正在执行 ${window.detail}…` : "思考中…") + ` ${secs}s · ${nSteps} 步 · ${fmt(tokens)} tokens · 按 Esc 或点「中断」可停止（现在也可以先输入下一条）`; }
  $("send").textContent = busy ? "中断" : "发送"; $("send").className = busy ? "stop" : "primary";
}
setInterval(() => { frame++; if (phase !== "idle") render(); }, 250);

function add(cls, html) { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; log.appendChild(d); scroll(); return d; }
function scroll() { main.scrollTop = main.scrollHeight; }
function hero() {
  log.innerHTML = `<div class="hero"><h2>想找点什么？</h2><p>用大白话告诉我名字、日期、大小等条件，我来搜索、统计或清理。</p><div class="chips"></div></div>`;
  SUGGEST.forEach(t => { const b = document.createElement("button"); b.className = "chip"; b.textContent = t; b.onclick = () => send(t); log.querySelector(".chips").appendChild(b); });
}
function argsBrief(a) {
  const s = Object.entries(a).map(([k, v]) => `${k}=${Array.isArray(v) ? `[${v.length} 项]` : JSON.stringify(v)}`).join(" ");
  return s.length > 140 ? s.slice(0, 140) + "…" : s;
}
function setBusy(b) { busy = b; render(); }
function applyState(s) {
  if (!s) return;
  $("ws").value = s.workspace; $("mode").value = s.mode === "bypass" ? "auto" : s.mode; $("model").textContent = s.model;
}

function handle(e) {
  if (log.querySelector(".hero") && e.kind !== "system" && e.kind !== "idle") log.innerHTML = "";
  switch (e.kind) {
    case "user": add("msg user", esc(e.text)); busy = true; setPhase("think"); break;
    case "tool": nSteps++; setPhase("tool", e.name);
      steps[e.id] = add("step", `<b>${esc(e.name)}</b> <code>${esc(argsBrief(e.args))}</code><span class="res"></span>`); break;
    case "span": tokens += e.tokens || 0; break;
    case "result": {
      const el = steps[e.id]; if (!el) break;
      const cls = e.denied || e.error ? "bad" : "good";
      const head = esc(e.content.split("\n")[0].slice(0, 90));
      setPhase("think");
      el.querySelector(".res").innerHTML = ` <span class="${cls}">${e.denied ? "已拒绝" : e.error ? "出错" : "✓"}</span><details><summary>${head}</summary><pre>${esc(e.content)}</pre></details>`;
      break; }
    case "approval": setPhase("wait"); showApproval(e); break;
    case "approval_done": { const el = document.getElementById("ap-" + e.id); if (el) { el.querySelector(".row").innerHTML = `<span class="${e.ok ? "good" : "bad"}">${e.ok ? "已允许" : "已拒绝"}</span>`; } setPhase("think"); break; }
    case "final":
      add("msg final", md(e.text) + (e.stats && e.stats.calls ? `<span class="meta">${e.stats.tools} 次操作 · ${e.stats.seconds}s · ${e.stats.tokens} tokens</span>` : "")); break;
    case "idle": busy = false; setPhase("idle"); applyState(e.state); break;
    case "system": add("sys", esc(e.text)); applyState(e.state); break;
    case "clear": steps = {}; hero(); break;
  }
  scroll();
}

function showApproval(e) {
  const a = e.args, list = a.paths || (a.path ? [a.path] : null);
  let detail = list && e.tool === "trash" ? `将移入回收站（可恢复）共 ${list.length} 项：\n` + list.join("\n")
    : e.tool === "bash" ? a.command : JSON.stringify(a, null, 2);
  const d = add("approval", `<h3>需要你确认：${esc(e.tool)}</h3><div class="why">${esc(e.reason)}</div><pre>${esc(detail)}</pre>
    <div class="row"><button class="primary" data-a="1">允许</button><button data-a="0">拒绝</button>${e.can_always ? `<button data-a="2">本次会话都允许 ${esc(e.tool)}</button>` : ""}</div>`);
  d.id = "ap-" + e.id;
  d.querySelectorAll("button").forEach(b => b.onclick = () => { d.querySelectorAll("button").forEach(x => x.disabled = true);
    api("/api/approve", {id: e.id, ok: b.dataset.a !== "0", always: b.dataset.a === "2"}); });
}

async function send(text) {
  text = (text ?? $("inp").value).trim();
  if (!text || busy) return;
  $("inp").value = ""; fit();
  const r = await api("/api/chat", {text});
  if (r.error) add("sys bad", esc(r.error));
}
function fit() { const t = $("inp"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }

const stop = () => { api("/api/stop", {}); $("stext").textContent = "正在中断…"; };
$("send").onclick = () => busy ? stop() : send();
$("inp").addEventListener("input", fit);
document.addEventListener("keydown", e => { if (e.key === "Escape" && busy) stop(); });
$("inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$("apply").onclick = async () => { const r = await api("/api/config", {workspace: $("ws").value, mode: $("mode").value}); if (r.error) add("sys bad", esc(r.error)); };
$("clear").onclick = () => api("/api/clear", {});

hero();
api("/api/state").then(s => { applyState(s); if (s.busy) { busy = true; setPhase("think"); } });
const es = new EventSource("/api/stream?t=" + T);
es.onmessage = m => handle(JSON.parse(m.data));
</script>
</body>
</html>
